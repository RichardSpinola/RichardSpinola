<svg xmlns="http://www.w3.org/2000/svg" width="320" height="330" viewBox="0 0 320 330" font-family="Fira Code, SFMono-Regular, Consolas, Liberation Mono, monospace">
<defs>
<pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".25"/></pattern>
<clipPath id="ka"><rect id="ra" x="40" y="288" width="0" height="26"/></clipPath>
<clipPath id="kb"><rect id="rb" x="40" y="288" width="0" height="26"/></clipPath>
</defs>
<style>
@keyframes ta{0%,3%{width:0;animation-timing-function:steps(16,end)}20%,45%{width:160.7px;animation-timing-function:steps(16,end)}50%,100%{width:0}}
@keyframes tb{0%,53%{width:0;animation-timing-function:steps(14,end)}70%,95%{width:140.6px;animation-timing-function:steps(14,end)}100%{width:0}}
@keyframes mv{0%,3%{transform:translateX(0);animation-timing-function:steps(16,end)}20%,45%{transform:translateX(160.7px);animation-timing-function:steps(16,end)}50%,53%{transform:translateX(0);animation-timing-function:steps(14,end)}70%,95%{transform:translateX(140.6px);animation-timing-function:steps(14,end)}100%{transform:translateX(0)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
#ra{animation:ta 16s linear infinite}
#rb{animation:tb 16s linear infinite}
#cm{animation:mv 16s linear infinite}
#c{animation:bl 1s steps(1) infinite}
</style>
<rect width="320" height="330" rx="10" fill="#0a192f" stroke="#233554"/>
<image href="data:image/png;base64," x="40" y="20" width="240" height="252"/>
<text x="40" y="306" font-size="16" fill="#3DDC97" xml:space="preserve" clip-path="url(#ka)">&gt; hello, visitor</text>
<text x="40" y="306" font-size="16" fill="#3DDC97" xml:space="preserve" clip-path="url(#kb)">&gt; hello, world</text>
<g id="cm"><rect id="c" x="40" y="292" width="9" height="18" fill="#3DDC97"/></g>
<rect width="320" height="330" rx="10" fill="url(#sl)"/>
</svg>